<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>LS-LATOR</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:#050816;
    font-family:'Poppins',sans-serif;
}

/* Animated Background */

.bg{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
}

.circle{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    opacity:0.7;
    animation:float 10s infinite alternate ease-in-out;
}

.circle1{
    width:350px;
    height:350px;
    background:#2563eb;
    top:-100px;
    left:-100px;
}

.circle2{
    width:350px;
    height:350px;
    background:#9333ea;
    bottom:-100px;
    right:-100px;
    animation-delay:3s;
}

@keyframes float{
    from{
        transform:translate(0,0) scale(1);
    }
    to{
        transform:translate(60px,40px) scale(1.15);
    }
}

/* Calculator */

.calculator{
    position:relative;
    width:380px;
    padding:25px;
    border-radius:35px;

    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,0.1);

    box-shadow:
        0 10px 40px rgba(0,0,0,0.5),
        inset 0 0 8px rgba(255,255,255,0.05);

    animation:appear 0.8s ease;
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(40px) scale(0.9);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* Header */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.logo{
    font-family:'Orbitron',sans-serif;
    font-size:1.4rem;
    color:white;
    letter-spacing:3px;

    text-shadow:
        0 0 8px #3b82f6,
        0 0 18px #3b82f6,
        0 0 28px #9333ea;
}

.live-dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 12px #22c55e;
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%{
        transform:scale(1);
        opacity:1;
    }

    50%{
        transform:scale(1.5);
        opacity:0.5;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}

/* Display */

.display{
    width:100%;
    height:95px;

    border:none;
    outline:none;

    border-radius:25px;

    padding:20px;

    text-align:right;

    font-size:2.2rem;

    color:white;

    background:rgba(255,255,255,0.06);

    font-family:'Orbitron',sans-serif;

    box-shadow:
        inset 0 0 12px rgba(0,0,0,0.4),
        inset 0 0 5px rgba(255,255,255,0.03);

    margin-bottom:25px;
}

/* Buttons */

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

button{
    position:relative;

    height:72px;

    border:none;
    border-radius:22px;

    font-size:1.15rem;
    font-weight:500;

    color:white;

    cursor:pointer;

    overflow:hidden;

    background:rgba(255,255,255,0.08);

    transition:all 0.18s ease;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.3),
        inset 0 0 3px rgba(255,255,255,0.1);
}

/* Hover Shine */

button::before{
    content:'';

    position:absolute;

    top:0;
    left:-100%;

    width:100%;
    height:100%;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.25),
        transparent
    );

    transition:0.5s;
}

button:hover::before{
    left:100%;
}

button:hover{
    transform:translateY(-4px) scale(1.03);

    background:rgba(255,255,255,0.12);
}

button:active{
    transform:scale(0.95);
}

/* Special Buttons */

.operator{
    background:linear-gradient(145deg,#2563eb,#3b82f6);
}

.equal{
    grid-column:span 2;

    background:linear-gradient(145deg,#14b8a6,#06b6d4);
}

.clear{
    background:linear-gradient(145deg,#ef4444,#dc2626);
}

.backspace{
    background:linear-gradient(145deg,#f59e0b,#d97706);
}

/* Responsive */

@media(max-width:430px){

    .calculator{
        width:95%;
        padding:20px;
    }

    button{
        height:65px;
    }

    .display{
        font-size:1.8rem;
    }
}

</style>
</head>

<body>

<div class="bg">
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
</div>

<div class="calculator">

    <div class="header">
        <div class="logo">⚡ LS-LATOR</div>
        <div class="live-dot"></div>
    </div>

    <input type="text" id="display" class="display" readonly>

    <div class="buttons">

        <button class="clear" onclick="clearDisplay()">AC</button>
        <button class="operator" onclick="appendValue('%')">%</button>
        <button class="operator" onclick="appendValue('/')">÷</button>
        <button class="operator" onclick="appendValue('*')">×</button>

        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('-')">−</button>

        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('+')">+</button>

        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button class="backspace" onclick="backspace()">⌫</button>

        <button onclick="appendValue('0')">0</button>
        <button onclick="appendValue('.')">.</button>

        <button class="equal" onclick="calculate()">=</button>

    </div>

</div>

<script>

const display = document.getElementById("display");

/* Add Value */

function appendValue(value){

    if(display.value === "Error"){
        display.value = "";
    }

    display.value += value;
}

/* Clear */

function clearDisplay(){
    display.value = "";
}

/* Backspace */

function backspace(){
    display.value = display.value.slice(0,-1);
}

/* Calculate */

function calculate(){

    try{

        let expression = display.value;

        if(expression.trim() === ""){
            return;
        }

        // safer parser
        let result = eval(expression);

        // floating precision fix
        result = parseFloat(Number(result).toPrecision(12));

        display.value = result;

        animateDisplay();

    }catch(error){

        display.value = "Error";

        shakeCalculator();
    }
}

/* Keyboard Support */

document.addEventListener("keydown", function(event){

    const key = event.key;

    if(!isNaN(key) || ['+','-','*','/','.','%'].includes(key)){

        appendValue(key);
    }

    else if(key === "Enter"){

        calculate();
    }

    else if(key === "Backspace"){

        backspace();
    }

    else if(key === "Escape"){

        clearDisplay();
    }
});

/* Display Animation */

function animateDisplay(){

    display.animate([
        { transform:'scale(1)' },
        { transform:'scale(1.05)' },
        { transform:'scale(1)' }
    ],{
        duration:250
    });
}

/* Error Shake */

function shakeCalculator(){

    document.querySelector('.calculator').animate([
        { transform:'translateX(0)' },
        { transform:'translateX(-8px)' },
        { transform:'translateX(8px)' },
        { transform:'translateX(0)' }
    ],{
        duration:300
    });
}

</script>

</body>
</html>
